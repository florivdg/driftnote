services:
  app:
    build:
      context: .
      args:
        BUN_VERSION: "1.3-alpine3.22"
    image: driftnote:latest
    ports:
      - "3000:3000"
    volumes:
      - driftnote_data:/app/data
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch(`http://127.0.0.1:${process.env.PORT||3000}/login`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  driftnote_data:
